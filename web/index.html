<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Majiro Engine</title>
<style>
  body { background: #111; color: #ddd; font-family: system-ui, sans-serif;
         margin: 0; display: flex; flex-direction: column; align-items: center; }
  #boot { margin-top: 20vh; text-align: center; }
  #boot button { font-size: 1.2rem; margin: 0.5rem; padding: 0.6rem 1.4rem; }
  #status { margin-top: 1rem; color: #9cf; }
  #stage { display: none; margin-top: 1rem; }
  #frame { position: relative; }
  #frame canvas { display: block; background: black;
                  max-width: 96vw; max-height: 86vh; }
  /* 仅画面全屏：舞台撑满屏幕，画布由 main.js 等比缩放居中（引擎按内部分辨率
     渲染；指针换算用 getBoundingClientRect，元素盒即画面，两种布局都正确）。 */
  #stage:fullscreen { display: flex; align-items: center; justify-content: center;
                      margin: 0; width: 100%; height: 100%; background: black; }
  #stage:fullscreen canvas { max-width: 100vw; max-height: 100vh; }
  /* 电影覆盖层（R7a）：精确铺在画布盒上；点击穿透给画布（跳过等输入仍进引擎）。 */
  #movie { position: absolute; inset: 0; width: 100%; height: 100%;
           object-fit: contain; background: black; pointer-events: none; }
  #toolbar { display: none; margin-top: 0.4rem; }
  #toolbar button { padding: 0.3rem 0.9rem; }
  #save-panel { display: none; margin-top: 0.6rem; padding: 0.8rem 1.2rem;
                border: 1px solid #444; border-radius: 6px; text-align: center; }
  #save-panel button { margin: 0.3rem; padding: 0.3rem 0.9rem; }
  #save-status { margin-top: 0.4rem; color: #9f9; font-size: 0.9rem;
                 min-height: 1.2em; }
</style>
</head>
<body>
  <div id="boot">
    <h1>Majiro Engine</h1>
    <p>请选择游戏目录（需包含 ARC 文件与 font.ttf）。</p>
    <button id="pick-owarusekai">終わる世界とバースデイ（owarusekai）</button>
    <button id="pick-ruri">ルリのかさね（ruri）</button>
    <button id="pick-paradise">終わる世界と双子座のパラダイス（paradise）</button>
    <div id="status"></div>
  </div>
  <div id="stage"><div id="frame"><canvas id="screen"></canvas></div></div>
  <div id="toolbar">
    <button id="save-manager">存档管理</button>
    <button id="fullscreen">全屏</button>
    <button id="mute">静音</button>
    <div id="save-panel">
      <button id="export-saves">导出存档 (.zip)</button>
      <label style="margin-left:0.5rem">导入:
        <input id="import-input" type="file" multiple
               accept=".zip,.sav,.mss,.dat">
      </label>
      <div id="save-files" style="margin-top:0.4rem"></div>
      <div id="save-status"></div>
    </div>
  </div>
<script type="module" src="main.js?v=2"></script>
</body>
</html>
