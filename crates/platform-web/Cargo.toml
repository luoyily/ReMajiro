[package]
name = "platform-web"
version = "0.1.0"
edition = "2021"
description = "Web (wasm32) adapters for engine ports: KeyboardEvent-to-VK translation table, console services, panic reporting, SAB IO bridge, and the engine worker bootstrap (ADR-0005)."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
web-time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
engine = { path = "../engine" }
formats = { path = "../formats" }
shell = { path = "../shell" }
vm = { path = "../vm" }
wgpu = { workspace = true }
winit = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = [
    "console",
    "Window",
    "OffscreenCanvas",
    "DedicatedWorkerGlobalScope",
    "AudioContext",
    "AudioContextOptions",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioProcessingEvent",
    "GainNode",
    "ChannelSplitterNode",
    "ChannelMergerNode",
    "ScriptProcessorNode",
] }
